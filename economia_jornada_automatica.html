<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Economia | Minha jornada de evolução</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f1;color:#17383d;font:17px/1.6 system-ui,sans-serif}header{background:#12383e;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}main{max-width:1050px;margin:30px auto;padding:0 20px}section{background:white;border-radius:24px;padding:clamp(20px,4vw,48px);box-shadow:0 12px 40px #17383d12}h1{font-size:clamp(32px,5vw,58px);line-height:1.1;margin:15px 0}h2{font-size:30px;line-height:1.2}h3{line-height:1.3}small,.muted{color:#557276}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 20px;background:#126c67;color:white;font-weight:650}button:hover{filter:brightness(.94)}button:disabled{opacity:.4;cursor:default}input,textarea,select{width:100%;border:1px solid #b8ccca;border-radius:10px;padding:12px;background:white;color:#17383d}textarea{min-height:90px}label{display:block;margin:12px 0 5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.tile{border:1px solid #d5e2df;border-radius:16px;padding:18px;background:#f8fbfa}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}.secondary{background:#e4eeeb;color:#174d4a}.progress{height:7px;background:#d7e5e1}.progress div{height:100%;background:#c69a4d;transition:width .4s}.eyebrow{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#98702d;font-weight:750}.hero{background:linear-gradient(135deg,#12383e,#236c67);color:white;position:relative;overflow:hidden}.hero p{max-width:650px}.hero .eyebrow{color:#f4cf83}.hero input{max-width:550px}.hero label{color:white}.choice{display:block;width:100%;text-align:left;margin:10px 0;background:#edf5f2;color:#17383d;border:1px solid #c8ded7}.choice.selected{background:#126c67;color:white}.feedback{padding:16px;background:#e5f2ec;border-left:4px solid #168579;border-radius:8px;margin:15px 0}.scale{display:flex;gap:7px;flex-wrap:wrap}.scale button{flex:1;min-width:40px;padding:8px;background:#e5eeeb;color:#17383d}.scale button.selected{background:#126c67;color:white}.legend{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px}.radar{width:100%;max-width:500px;display:block;margin:auto}.metric{font-size:32px;font-weight:750}.error{color:#a02e25}details{margin:10px 0}summary{cursor:pointer;font-weight:700}footer{text-align:center;color:#557276;padding:20px;font-size:13px}@media print{header,.progress,.nav,footer,.no-print{display:none!important}body{background:white}main{margin:0;max-width:none;padding:0}section{box-shadow:none;padding:12px}.tile{break-inside:avoid}.radar{max-width:350px}.grid{display:block}h1{font-size:30px}}</style><header><strong>ECONOMIA & MERCADO</strong><span id="stage">Sua trajetória</span></header><div class="progress"><div id="bar"></div></div><main id="app"></main><footer>Experiência de aprendizagem • Ensino técnico • Evolução individual</footer><script>
const groups=[['Conhecimentos',['Fundamentos da economia','Micro e macroeconomia','Oferta e demanda','Estruturas de mercado','Formação de preços','Taxas e impostos','Inflação e juros','Emprego e renda']],['Habilidades',['Pensamento crítico','Interpretação de notícias','Tomada de decisões','Resolução de problemas','Visão de mercado','Argumentação','Análise de cenários','Aplicação prática']]];
const scale=['Ainda não consigo','Reconheço, com dificuldade','Compreendo e explico','Aplico em situações práticas','Analiso e justifico com autonomia'];
const lessons=[['Escassez e escolhas','Uma família tem orçamento limitado e precisa escolher entre lazer e poupança.','Escassez exige escolhas; custo de oportunidade é o valor da melhor alternativa abandonada.'],['Micro e macroeconomia','Uma padaria muda seus preços enquanto o país enfrenta inflação.','A microeconomia estuda agentes e mercados específicos; a macroeconomia analisa agregados como inflação, PIB e emprego.'],['Oferta e demanda','Uma seca reduz a colheita de café.','Com demanda constante, menor oferta tende a elevar o preço de equilíbrio.'],['Estruturas de mercado','Poucas empresas concentram um setor.','Oligopólio é uma estrutura com poucos vendedores relevantes e interdependência estratégica.'],['Formação de preços','Uma loja precisa pagar custos e competir.','Preço envolve custos, tributos, margem, concorrência e disposição a pagar.'],['Tributação','Uma prefeitura arrecada IPTU.','Tributos financiam atividades públicas; IPTU é imposto municipal, IPVA estadual e IPI federal.'],['Inflação e juros','O crédito encarece enquanto os preços sobem.','Inflação reduz poder de compra quando a renda não acompanha os preços; juros influenciam crédito e demanda.'],['Emprego e renda','Uma indústria reduz produção após queda nas vendas.','Menor demanda pode reduzir produção e emprego, com efeitos sobre renda e consumo.']];
const qs=[
['Uma família escolhe pagar um curso em vez de viajar. Qual é o custo de oportunidade?',['O preço do curso','O benefício da viagem abandonada','A renda total da família','O imposto sobre o curso'],1,'O custo de oportunidade é o benefício da melhor alternativa sacrificada.'],
['Uma rede de lojas reduz preços; simultaneamente o PIB nacional recua. Como classificar os fenômenos?',['Ambos macroeconômicos','Ambos microeconômicos','Primeiro microeconômico, segundo macroeconômico','Primeiro macroeconômico, segundo microeconômico'],2,'A decisão de uma empresa é microeconômica; PIB é agregado macroeconômico.'],
['Uma seca reduz a oferta de café, mantendo a demanda constante. Qual tendência no equilíbrio?',['Preço maior e quantidade menor','Preço menor e quantidade maior','Preço e quantidade maiores','Preço e quantidade menores'],0,'A contração da oferta tende a elevar o preço e reduzir a quantidade negociada.'],
['Quatro empresas dominam um setor e observam as decisões umas das outras. Qual estrutura é mais compatível?',['Concorrência perfeita','Monopólio','Concorrência monopolística','Oligopólio'],3,'Poucos vendedores relevantes e interdependência caracterizam oligopólio.'],
['Uma loja sofre aumento de custos, mas clientes são sensíveis ao preço. Qual análise é mais adequada?',['Repassar integralmente sem analisar vendas','Avaliar margem, concorrência e reação da demanda','Reduzir preços independentemente dos custos','Manter preços porque custos não influenciam margem'],1,'A decisão exige equilibrar custos, margem e resposta do mercado.'],
['Uma empresa precisa identificar a competência de IPTU, IPVA e IPI, respectivamente.',['Estadual, municipal, federal','Federal, estadual, municipal','Municipal, estadual, federal','Municipal, federal, estadual'],2,'IPTU é municipal, IPVA estadual e IPI federal.'],
['Salários sobem 4% e os preços da cesta consumida sobem 7%. O que ocorre com o poder de compra dessa renda?',['Diminui','Aumenta 3%','Permanece constante','Aumenta 11%'],0,'A renda nominal cresceu menos que os preços, reduzindo o poder de compra.'],
['O Banco Central eleva a taxa básica de juros para combater inflação de demanda. Qual efeito é esperado, mantidos outros fatores?',['Crédito mais barato e consumo maior','Expansão imediata da oferta agrícola','Aumento automático dos salários reais','Crédito mais caro e menor estímulo ao consumo'],3,'Juros maiores tendem a restringir crédito e demanda, com efeitos defasados.'],
['Vendas caem por vários meses. Qual cadeia de efeitos é plausível?',['Menor consumo sempre eleva salários','Menor produção pode reduzir emprego e renda','Menor produção garante queda de todos os preços','Menor emprego aumenta necessariamente o consumo'],1,'A queda da demanda pode reduzir produção, emprego e renda, reforçando a desaceleração.'],
['Uma notícia afirma que um único produto ficou mais caro. Qual conclusão é fundamentada?',['A inflação nacional necessariamente subiu','O PIB necessariamente caiu','É preciso observar uma cesta de preços para avaliar inflação geral','O desemprego necessariamente aumentou'],2,'A variação isolada de um produto não comprova inflação generalizada.'],
['Uma empresa avalia investir em máquinas com juros altos e demanda incerta. Qual conduta é mais fundamentada?',['Comparar custo do financiamento, retorno esperado e cenários de vendas','Investir porque máquinas sempre geram lucro','Cancelar porque juros altos tornam todo investimento inviável','Considerar somente o preço da máquina'],0,'A decisão exige análise de retorno, custo de capital e risco.'],
['Uma redução tributária sobre alimentos é proposta. Qual avaliação é mais completa?',['A arrecadação sempre aumenta','O preço final cai exatamente na proporção do tributo','A medida não afeta nenhum agente','Analisar repasse aos preços, arrecadação e efeitos distributivos'],3,'O repasse depende do mercado; também há efeitos fiscais e distributivos.']];
qs.push(...[["Uma pequena empresa enfrenta custos maiores, juros elevados e queda nas vendas. Qual estratégia combina melhor os três fatores?", ["Expandir estoque com crédito caro", "Rever custos e mix de produtos, preservando caixa e avaliando a demanda", "Aumentar todos os preços sem avaliar clientes", "Reduzir a margem sem calcular a viabilidade"], 1, "Rever custos, demanda e liquidez integra decisões de preço e financiamento."], ["O PIB cresceu, mas muitas famílias ainda enfrentam dificuldades. Qual explicação é mais consistente?", ["O crescimento garante renda igual para todos", "O PIB mede diretamente o poder de compra de cada família", "A distribuição dos ganhos e a inflação podem limitar a melhora da renda real", "O crescimento do PIB exclui a possibilidade de desemprego"], 2, "O crescimento agregado não garante distribuição uniforme de renda nem aumento do poder de compra."]]);
const reflections=[["Antes da disciplina, como você enxergava a economia?", ["Como algo distante do cotidiano", "Como assunto de preços e dinheiro", "Como um conjunto de relações entre empresas, famílias e governo", "Já conseguia analisar fenômenos econômicos com autonomia"]], ["Qual conquista você mais reconhece hoje?", ["Compreender conceitos econômicos", "Interpretar notícias e indicadores", "Analisar decisões de empresas e consumidores", "Argumentar com fundamentos econômicos"]], ["Onde pretende aplicar seus conhecimentos?", ["Planejamento financeiro pessoal", "Decisões profissionais e empresariais", "Interpretação de notícias e cidadania", "Em todas essas situações"]], ["Qual competência deseja continuar desenvolvendo?", ["Análise de inflação e juros", "Formação de preços e tributação", "Análise de mercados e emprego", "Pensamento crítico e tomada de decisões"]]];
const blank=()=>groups.map(g=>g[1].map(()=>null));let s={step:0,name:'',turma:'',before:blank(),after:blank(),seen:[],answers:[],ref:[null,null,null,null],q:0};try{const old=JSON.parse(localStorage.getItem('eco-jornada-v2'));if(old&&old.before&&old.ref)s=old}catch(e){};const app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('eco-jornada-v2',JSON.stringify(s))}catch(e){}}function go(n){s.step=n;save();render();window.scrollTo(0,0)}function set(k,v){s[k]=v;save()}function nav(back,next,label='Continuar'){return `<div class="nav">${back===null?'':`<button class="secondary" onclick="go(${back})">Voltar</button>`}<button onclick="${next}">${label} →</button></div>`}function err(t){document.getElementById('error').textContent=t}function start(){if(!s.name.trim())return err('Informe seu nome.');go(1)}function rate(k,g,i,v){s[k][g][i]=v;save();render()}function assess(k,next){if(s[k].flat().some(v=>v===null))return err('Responda todos os itens antes de avançar.');go(next)}function assessment(k){return `<p>Use a escala abaixo. ${k==='before'?'Pense em como você se percebia antes de começar a disciplina.':'Considere o que conseguiu demonstrar nos desafios. Não é necessário atribuir nível 5 a tudo.'}</p><div class="tile">${scale.map((x,i)=>`<div><b>${i+1}</b> — ${x}</div>`).join('')}</div>${groups.map((g,j)=>`<h2>${g[0]}</h2><div class="grid">${g[1].map((t,i)=>`<div class="tile"><b>${t}</b><div class="scale" role="group" aria-label="${t}">${scale.map((x,v)=>`<button title="${x}" aria-pressed="${s[k][j][i]===v+1}" class="${s[k][j][i]===v+1?'selected':''}" onclick="rate('${k}',${j},${i},${v+1})">${v+1}</button>`).join('')}</div></div>`).join('')}</div>`).join('')}`}
function reveal(i){if(!s.seen.includes(i))s.seen.push(i);save();render()}function choose(i){if(s.answers[s.q]!==undefined)return;s.answers[s.q]=i;save();render()}function nextQ(){s.q++;save();render()}function refSet(i,v){s.ref[i]=v;save();render()}function finishChallenges(){go(4)}function finish(){if(s.ref.some(x=>x===null))return err('Selecione uma alternativa em cada reflexão.');go(7)}const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;const fmt=n=>n.toFixed(2).replace('.',',');function radar(j){const a=s.before[j],b=s.after[j],p=(i,v)=>[250+v*28*Math.sin(i*Math.PI/4),220-v*28*Math.cos(i*Math.PI/4)],poly=v=>v.map((n,i)=>p(i,n).join(',')).join(' ');const short=j===0?[['Fundamentos'],['Micro / macro'],['Oferta e','demanda'],['Estruturas'],['Preços'],['Tributos'],['Inflação / juros'],['Emprego / renda']]:[['Pensamento','crítico'],['Interpretação'],['Decisões'],['Resolução'],['Visão de','mercado'],['Argumentação'],['Cenários'],['Aplicação']];return `<svg class="radar" viewBox="0 0 500 440" role="img" aria-label="Teia de ${groups[j][0]}">${[1,2,3,4,5].map(v=>`<polygon points="${poly(Array(8).fill(v))}" fill="none" stroke="#cadbd7"/><text x="255" y="${224-v*28}" font-size="10" fill="#607b7a">${v}</text>`).join('')}${short.map((t,i)=>`<line x1="250" y1="220" x2="${p(i,5)[0]}" y2="${p(i,5)[1]}" stroke="#cadbd7"/>${t.map((l,k)=>`<text x="${p(i,6.1)[0]}" y="${p(i,6.1)[1]+k*14}" text-anchor="middle" font-size="12" fill="#17383d">${l}</text>`).join('')}`).join('')}<polygon points="${poly(a)}" fill="#d7a34b" fill-opacity=".23" stroke="#b9852d" stroke-width="2" stroke-dasharray="6 4"/><polygon points="${poly(b)}" fill="#168579" fill-opacity=".22" stroke="#168579" stroke-width="3"><animate attributeName="points" from="${poly(a)}" to="${poly(b)}" dur="1.6s" fill="freeze"/></polygon></svg>`}function charts(){return `<div class="legend"><span><i class="dot" style="background:#b9852d"></i>Antes</span><span><i class="dot" style="background:#168579"></i>Agora</span></div><div class="grid">${groups.map((g,j)=>`<div class="tile"><h3>${g[0]}</h3>${radar(j)}<div class="metric">${fmt(avg(s.before[j]))} → ${fmt(avg(s.after[j]))}</div><small>Variação percebida: ${fmt(avg(s.after[j])-avg(s.before[j]))} pontos na escala de 1 a 5</small><details><summary>Ver valores por competência</summary>${g[1].map((t,i)=>`<div>${t}: ${s.before[j][i]} → ${s.after[j][i]}</div>`).join('')}</details></div>`).join('')}</div>`}function score(){return s.answers.filter((a,i)=>a===qs[i][2]).length}function download(){const lines=['ECONOMIA E MERCADO — MINHA JORNADA',s.name+' | '+s.turma,'Autoavaliação retrospectiva (1–5):',...groups.flatMap((g,j)=>[g[0],...g[1].map((t,i)=>t+': '+s.before[j][i]+' → '+s.after[j][i])]),'Desafios objetivos: '+score()+'/'+qs.length,...qs.map((q,i)=>q[0]+'\nResposta: '+q[1][s.answers[i]]+'\n'+(s.answers[i]===q[2]?'Acerto':'Revisar')+' — '+q[3]),...reflections.map((q,i)=>q[0]+'\n'+q[1][s.ref[i]])];const url=URL.createObjectURL(new Blob([lines.join('\n\n')],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Evolucao_'+s.name.replace(/[^\p{L}\p{N}]+/gu,'_')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function render(){document.getElementById('stage').textContent=s.step===0?'Sua trajetória':s.step===7?'Jornada concluída':`Etapa ${s.step} de 6`;document.getElementById('bar').style.width=(s.step===7?100:Math.max(0,s.step-1)/6*100)+'%';let h='';switch(s.step){case 0:h=`<section class="hero"><div class="eyebrow">Uma experiência de encerramento</div><h1>O mundo é o mesmo.<br>Sua maneira de enxergá-lo mudou.</h1><p>Hoje você vai revisitar sua trajetória, demonstrar o que aprendeu e descobrir sua própria teia de evolução. Não há ranking. O ponto de comparação é você.</p><label>Seu nome</label><input value="${esc(s.name)}" oninput="set('name',this.value)" placeholder="Nome completo"><label>Turma (opcional)</label><input value="${esc(s.turma)}" oninput="set('turma',this.value)"><p><button onclick="start()">Iniciar minha jornada →</button></p><p id="error" style="color:#ffcf9d"></p></section>`;break;case 1:h=`<section><div class="eyebrow">01 • Ponto de partida</div><h1>Quem eu era</h1>${assessment('before')}<p id="error" class="error"></p>${nav(0,"assess('before',2)")}</section>`;break;case 2:h=`<section><div class="eyebrow">02 • Retrospectiva</div><h1>O que descobri</h1><p>Leia cada situação. Antes de revelar, pense no conceito econômico envolvido.</p><div class="grid">${lessons.map((l,i)=>`<div class="tile"><small>0${i+1}</small><h3>${l[0]}</h3><p>${l[1]}</p>${s.seen.includes(i)?`<div class="feedback">${l[2]}</div>`:`<button onclick="reveal(${i})">Revelar conexão</button>`}</div>`).join('')}</div><p>${s.seen.length} de 8 conexões exploradas</p><p id="error" class="error"></p>${nav(1,"s.seen.length===8?go(3):err('Explore todas as conexões.')")}</section>`;break;case 3:if(s.q<qs.length){const q=qs[s.q],a=s.answers[s.q];h=`<section><div class="eyebrow">03 • Desafio ${s.q+1} de ${qs.length}</div><h2>${q[0]}</h2>${q[1].map((t,i)=>`<button class="choice ${a===i?'selected':''}" ${a!==undefined?'disabled':''} onclick="choose(${i})">${String.fromCharCode(65+i)}. ${t}</button>`).join('')}${a!==undefined?`<div class="feedback"><b>${a===q[2]?'Você demonstrou compreensão!':'Uma oportunidade de revisar'}</b><br>${q[3]}</div><button onclick="nextQ()">Próximo desafio →</button>`:''}</section>`}else{h=`<section><div class="eyebrow">03 • Resultado automático</div><h1>Economia na prática</h1><p>Você acertou ${score()} de ${qs.length} desafios. Todas as respostas foram corrigidas automaticamente. Agora avalie sua evolução.</p><p id="error" class="error"></p>${nav(2,'finishChallenges()')}</section>`}break;case 4:h=`<section><div class="eyebrow">04 • Reconhecimento</div><h1>Quem sou agora</h1>${assessment('after')}<p id="error" class="error"></p>${nav(3,"assess('after',5)",'Revelar minha evolução')}</section>`;break;case 5:h=`<section><div class="eyebrow">05 • Minha transformação</div><h1>Veja sua trajetória</h1><p>As teias representam sua percepção de aprendizagem. Uma redução em algum eixo também pode indicar que você passou a compreender melhor a complexidade do tema.</p>${charts()}<div class="tile"><h3>Evidência objetiva</h3><div class="metric">${score()} / ${qs.length}</div><p>Acertos nos desafios. Este resultado é separado da autoavaliação e não mede sozinho a evolução desde o início do curso.</p></div>${nav(4,'go(6)')}</section>`;break;case 6:h=`<section><div class="eyebrow">06 • Meu legado</div><h1>O que levo para a vida</h1><p>Escolha a alternativa que melhor representa sua trajetória. Não há respostas certas ou erradas nesta etapa.</p>${reflections.map((q,i)=>`<div class="tile"><b>${q[0]}</b>${q[1].map((t,j)=>`<button class="choice ${s.ref[i]===j?'selected':''}" aria-pressed="${s.ref[i]===j}" onclick="refSet(${i},${j})">${t}</button>`).join('')}</div>`).join('')}<p id="error" class="error"></p>${nav(5,'finish()','Concluir jornada')}</section>`;break;case 7:h=`<section><div class="eyebrow">Jornada concluída • Certificado simbólico</div><h1>${esc(s.name)}, reconheça sua trajetória.</h1><p>${esc(s.turma)} • Economia e Mercado</p><p>Você concluiu a experiência de reflexão e aplicação dos conhecimentos econômicos.</p>${charts()}<h2>Conhecimentos demonstrados</h2><div class="metric">${score()} de ${qs.length} acertos</div><details><summary>Revisar desempenho por questão</summary>${qs.map((q,i)=>`<p><b>${i+1}. ${s.answers[i]===q[2]?'Acerto':'Revisar'}</b> — ${q[0]}<br>${q[3]}</p>`).join('')}</details><h2>Minha reflexão</h2>${reflections.map((q,i)=>`<div class="tile"><b>${q[0]}</b><p>${esc(q[1][s.ref[i]])}</p></div>`).join('')}<h2>A disciplina termina. Sua evolução continua.</h2><p>Leve consigo a capacidade de questionar, interpretar e tomar decisões mais conscientes.</p><div class="nav"><button onclick="window.print()">Salvar relatório em PDF / imprimir</button><button class="secondary" onclick="download()">Baixar respostas em texto</button><button class="secondary" onclick="go(6)">Editar reflexão</button></div><p class="no-print muted">Envie o relatório à professora pelo canal indicado. Os dados ficam neste navegador, não são enviados automaticamente.</p><button class="no-print secondary" onclick="if(confirm('Apagar esta jornada deste navegador?')){localStorage.removeItem('eco-jornada-v2');location.reload()}">Iniciar nova jornada (apagar dados)</button></section>`;break;}app.innerHTML=h}render();</script></html>
